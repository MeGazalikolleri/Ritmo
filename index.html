<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ff4d00">
<meta name="description" content="Horolix — infinite retro calendar from BCE to ∞">
<title>Horolix · Retro Calendar · BCE to ∞</title>

<script>
  (function () {
    try {
      document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("horolix_theme") || "light"
      );
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=VT323&display=swap" rel="stylesheet">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ff4d00'/%3E%3Ctext x='50' y='72' font-family='monospace' font-size='64' font-weight='bold' text-anchor='middle' fill='%23fff'%3EH%3C/text%3E%3C/svg%3E">

<style>
  /* ============================================================
     HOROLIX — design tokens
     ============================================================ */
  :root,
  html[data-theme="light"] {
    --paper:       #f4f1e8;
    --paper-2:     #ebe6d6;
    --ink:         #1a1a1a;
    --ink-soft:    #333028;
    --mute:        #8a8577;
    --line:        #1a1a1a;
    --line-soft:   #c8c2b0;

    --accent:      #ff4d00;
    --accent-soft: #ffe4d6;
    --accent2:     #ffd400;
    --accent3:     #0055ff;

    --hover:       #ebe6d6;
    --today-bg:    #ff4d00;
    --today-fg:    #ffffff;
    --chip-fg:     #ffffff;

    --shadow:      4px 4px 0 #1a1a1a;
    --grain-1:     rgba(26, 26, 26, 0.025);
    --grain-2:     rgba(26, 26, 26, 0.02);

    --scroll-track: #f4f1e8;
    --scroll-thumb: #1a1a1a;

    color-scheme: light;
  }

  html[data-theme="dark"] {
    --paper:       #15130e;
    --paper-2:     #1e1a14;
    --ink:         #f5efdc;
    --ink-soft:    #cfc8b0;
    --mute:        #8a8370;
    --line:        #f5efdc;
    --line-soft:   #3a352b;

    --accent:      #ff7a33;
    --accent-soft: #3a1f0e;
    --accent2:     #ffd94a;
    --accent3:     #4aa3ff;

    --hover:       #221e16;
    --today-bg:    #ff7a33;
    --today-fg:    #15130e;
    --chip-fg:     #ffffff;

    --shadow:      4px 4px 0 #f5efdc;
    --grain-1:     rgba(245, 239, 220, 0.035);
    --grain-2:     rgba(245, 239, 220, 0.02);

    --scroll-track: #15130e;
    --scroll-thumb: #f5efdc;

    color-scheme: dark;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    border-radius: 0 !important;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  html, body { height: 100%; width: 100%; }

  body {
    height: 100vh;
    height: 100dvh;
    background: var(--paper);
    color: var(--ink);
    overflow: hidden;
    font-size: 14px;
    line-height: 1.35;
    font-weight: 500;
    background-image:
      repeating-linear-gradient(0deg, var(--grain-1) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, var(--grain-2) 0 1px, transparent 1px 4px);
  }

  .app {
    display: flex;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    position: relative;
  }

  /* ============================================================
     MENU TOGGLE + BACKDROP (mobile)
     ============================================================ */
  #menuToggle {
    display: none;
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 300;
    background: var(--accent);
    color: #fff;
    border: 2px solid var(--ink);
    padding: 0.5rem 0.8rem;
    font-weight: 800;
    font-size: 1rem;
    box-shadow: 3px 3px 0 var(--ink);
    cursor: pointer;
  }
  #menuToggle:active { box-shadow: none; transform: translate(3px, 3px); }

  #sideBackdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: 199;
    opacity: 0;
    transition: opacity 0.15s linear;
  }
  #sideBackdrop.show { display: block; opacity: 1; }

  /* ============================================================
     SIDEBAR
     ============================================================ */
  .sidebar {
    width: 320px;
    flex-shrink: 0;
    background: var(--paper);
    border-right: 3px solid var(--line);
    padding: 1.25rem 1.1rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
    overflow-y: auto;
    position: relative;
    min-height: 0;
    z-index: 200;
  }

  .sidebar::after {
    content: "";
    position: absolute;
    top: 0; right: -3px;
    width: 3px; height: 100%;
    background: repeating-linear-gradient(180deg,
      var(--accent) 0 12px, var(--ink) 12px 24px);
    opacity: 0.7;
    pointer-events: none;
  }

  .sidebar h1 {
    font-family: 'VT323', 'JetBrains Mono', monospace;
    font-size: 2.6rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 0.9;
    color: var(--ink);
    border-bottom: 3px solid var(--line);
    padding-bottom: 0.5rem;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .sidebar h1::before {
    content: "◼";
    color: var(--accent);
    font-size: 1rem;
    transform: translateY(-4px);
  }
  .sidebar h1::after {
    content: "·HOROLIX";
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.55rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: var(--mute);
    align-self: flex-end;
    margin-left: auto;
  }

  button {
    padding: 0.65rem 0.9rem;
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    border: 2px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    user-select: none;
  }
  button:hover { background: var(--ink); color: var(--paper); }
  button:active { transform: translate(2px, 2px); }

  #newEventBtn {
    background: var(--accent);
    color: #fff;
    border-color: var(--ink);
    font-weight: 800;
    padding: 0.85rem 1rem;
    font-size: 0.85rem;
    box-shadow: var(--shadow);
  }
  #newEventBtn:hover { background: var(--ink); color: var(--accent); }
  #newEventBtn:active { box-shadow: none; transform: translate(4px, 4px); }

  /* Date readout box */
  .dateBox {
    background: var(--ink);
    color: var(--paper);
    padding: 0.9rem 0.75rem;
    text-align: center;
    border: 2px solid var(--ink);
    position: relative;
    overflow: hidden;
  }
  .dateBox::before {
    content: "◉ TODAY · IST";
    position: absolute;
    top: 4px; left: 8px;
    font-size: 0.55rem;
    letter-spacing: 0.15em;
    color: var(--accent2);
    font-weight: 700;
  }
  #todayDateBig {
    font-family: 'VT323', monospace;
    font-size: 2.4rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    line-height: 1;
    color: var(--accent2);
    text-shadow: 0 0 8px rgba(255, 217, 74, 0.45);
    margin-top: 0.5rem;
    font-variant-numeric: tabular-nums;
  }
  #todayDateSub {
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-top: 6px;
    color: #9a9484;
  }

  /* Inputs */
  input, select, textarea {
    width: 100%;
    padding: 0.6rem 0.7rem;
    border: 2px solid var(--ink);
    background: var(--paper);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.03em;
    outline: none;
    color: var(--ink);
    text-transform: uppercase;
  }
  input::placeholder, textarea::placeholder {
    color: var(--mute);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  input:focus, select:focus, textarea:focus {
    background: var(--accent2);
    color: #1a1a1a;
  }

  .year-row { display: flex; align-items: stretch; }
  .year-row button {
    border: 2px solid var(--ink);
    padding: 0 10px;
    min-width: 56px;
    font-weight: 800;
    font-size: 0.7rem;
  }
  .year-row button:first-child { border-right: none; }
  .year-row button:last-child  { border-left: none; }
  .year-row select {
    border-left: 2px solid var(--ink);
    border-right: 2px solid var(--ink);
    text-align: center;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    padding: 0.55rem 0.4rem;
  }

  .decade-row { display: flex; gap: 6px; }
  .decade-row button {
    flex: 1; padding: 0.5rem;
    font-size: 0.68rem; font-weight: 700;
  }

  .importExport { display: flex; gap: 6px; }
  .importExport button {
    flex: 1; font-size: 0.68rem;
    padding: 0.55rem 0.4rem;
  }

  .sidebar-foot {
    margin-top: auto;
    padding-top: 0.75rem;
    border-top: 2px dashed var(--mute);
    font-size: 0.6rem;
    text-align: center;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--mute);
    font-weight: 700;
  }
  .sidebar-foot span { color: var(--accent); }

  /* ============================================================
     MAIN
     ============================================================ */
  .calendarContainer {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--paper);
    min-width: 0;
    min-height: 0;
  }

  .calendarHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.85rem 1.5rem;
    background: var(--paper);
    border-bottom: 3px solid var(--line);
    gap: 1rem;
    flex-wrap: wrap;
    position: relative;
    flex-shrink: 0;
  }
  .calendarHeader::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -3px;
    height: 3px;
    background: repeating-linear-gradient(90deg,
      var(--accent) 0 20px, var(--accent3) 20px 40px, var(--ink) 40px 60px);
    opacity: 0.5;
  }

  .leftHeader, .rightHeader {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  }
  .leftHeader button, .rightHeader button {
    padding: 0.5rem 0.85rem;
    font-size: 0.7rem;
    font-weight: 700;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .leftHeader button:active, .rightHeader button:active {
    box-shadow: none;
    transform: translate(3px, 3px);
  }

  .viewBtn {
    background: var(--paper);
    border: 2px solid var(--ink);
    color: var(--ink);
  }
  .viewBtn.active {
    background: var(--ink);
    color: var(--paper);
    box-shadow: none;
    transform: translate(3px, 3px);
  }

  .calendarHeader h2 {
    font-family: 'VT323', 'JetBrains Mono', monospace;
    font-size: 1.9rem;
    font-weight: 400;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink);
    line-height: 1;
  }

  .weekDays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: var(--ink);
    color: var(--paper);
    padding: 0.5rem 0;
    text-align: center;
    font-weight: 800;
    text-transform: uppercase;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    flex-shrink: 0;
  }
  .weekDays div {
    border-right: 1px solid var(--paper);
    opacity: 0.85;
  }
  .weekDays div:last-child { border-right: none; }

  #calendarGrid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: minmax(115px, auto);
    overflow-y: auto;
    background: var(--paper);
    border-left: 3px solid var(--line);
    border-right: 3px solid var(--line);
    min-height: 0;
  }

  .dayCell {
    background: var(--paper);
    border-right: 2px solid var(--ink);
    border-bottom: 2px solid var(--ink);
    padding: 8px;
    overflow-y: auto;
    cursor: pointer;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 60px;
  }
  .dayCell:hover { background: var(--hover); }
  .dayCell.today-highlight {
    background: var(--today-bg);
    color: var(--today-fg);
  }
  .dayCell.today-highlight .dayNumber { color: var(--today-fg); }

  .dayNumber {
    font-family: 'VT323', 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 1.35rem;
    line-height: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    letter-spacing: 0.02em;
    color: var(--ink);
  }

  .today-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.55rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 2px 6px;
    border: 1px solid #fff;
  }
  html[data-theme="dark"] .today-icon {
    background: var(--today-fg);
    color: var(--today-bg);
    border-color: var(--today-fg);
  }

  .eventChip {
    padding: 4px 6px;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--chip-fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: grab;
    border: 1px solid var(--ink);
  }
  .eventChip:active { cursor: grabbing; }

  /* ============================================================
     MODAL
     ============================================================ */
  .modal {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.78);
    display: flex; justify-content: center; align-items: center;
    z-index: 1000;
    padding: 1rem;
  }
  .hidden { display: none !important; }

  .modalContent {
    width: 500px;
    max-width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    background: var(--paper);
    padding: 1.5rem 1.5rem 1.25rem;
    display: flex; flex-direction: column; gap: 12px;
    border: 3px solid var(--ink);
    box-shadow: 10px 10px 0 var(--ink);
    position: relative;
    color: var(--ink);
  }
  .modalContent::before {
    content: "";
    position: absolute;
    top: -12px; left: 20px;
    width: 60px; height: 8px;
    background: var(--accent2);
    border: 2px solid var(--ink);
    transform: rotate(-3deg);
  }

  .modalContent h2 {
    font-family: 'VT323', monospace;
    font-size: 2rem;
    font-weight: 400;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 0.4rem;
    margin-bottom: 0.25rem;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modalContent h2::before {
    content: "▶";
    color: var(--accent);
    font-size: 0.9rem;
    font-family: 'JetBrains Mono', monospace;
  }

  .modalActions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .modalActions button {
    flex: 1 1 100px;
    padding: 0.75rem 1rem;
    font-weight: 800;
    font-size: 0.75rem;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .modalActions button:active { box-shadow: none; transform: translate(3px, 3px); }

  #saveEventBtn {
    background: var(--accent);
    color: #fff;
    border-color: var(--ink);
  }
  #saveEventBtn:hover { background: var(--ink); color: var(--accent); }

  #deleteEventBtn {
    background: var(--paper);
    color: var(--ink);
    border-color: var(--ink);
  }
  #deleteEventBtn:hover {
    background: #b30000;
    color: #fff;
    border-color: #b30000;
  }

  /* ============================================================
     SCROLLBARS
     ============================================================ */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--scroll-track); border-left: 2px solid var(--ink); }
  ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border: 2px solid var(--scroll-track); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 1024px) {
    .sidebar { width: 280px; padding: 1rem; }
    .sidebar h1 { font-size: 2.3rem; }
    #todayDateBig { font-size: 2rem; }
  }

  @media (max-width: 820px) {
    #menuToggle { display: inline-flex; }
    .sidebar {
      position: fixed;
      top: 0; left: 0;
      height: 100vh; height: 100dvh;
      width: 300px;
      max-width: 85vw;
      transform: translateX(-100%);
      transition: transform 0.2s ease-out;
      box-shadow: 6px 0 0 rgba(0, 0, 0, 0.2);
    }
    .sidebar.open { transform: translateX(0); }
    .calendarHeader { padding-left: 4.5rem; }
    .calendarHeader h2 {
      font-size: 1.5rem;
      flex-basis: 100%;
      order: -1;
      margin-bottom: 0.25rem;
    }
    #calendarGrid { grid-auto-rows: minmax(85px, auto); }
    .dayNumber { font-size: 1.1rem; }
    .eventChip { font-size: 0.58rem; padding: 3px 4px; }
  }

  @media (max-width: 560px) {
    body { font-size: 13px; }
    #menuToggle { top: 8px; left: 8px; padding: 0.45rem 0.65rem; font-size: 0.9rem; }
    .calendarHeader { padding: 0.6rem 0.75rem 0.6rem 3.5rem; gap: 0.5rem; }
    .calendarHeader h2 { font-size: 1.25rem; }
    .leftHeader button, .rightHeader button, .viewBtn {
      padding: 0.4rem 0.6rem;
      font-size: 0.62rem;
      box-shadow: 2px 2px 0 var(--ink);
    }
    .leftHeader button:active, .rightHeader button:active, .viewBtn.active {
      box-shadow: none;
      transform: translate(2px, 2px);
    }
    .weekDays {
      font-size: 0.55rem;
      letter-spacing: 0.08em;
      padding: 0.35rem 0;
    }
    #calendarGrid {
      grid-auto-rows: minmax(70px, auto);
      border-left-width: 2px;
      border-right-width: 2px;
    }
    .dayCell { padding: 4px; gap: 2px; }
    .dayNumber { font-size: 0.95rem; gap: 4px; }
    .today-icon { font-size: 0.5rem; padding: 1px 4px; letter-spacing: 0.05em; }
    .eventChip { font-size: 0.55rem; padding: 2px 4px; letter-spacing: 0.02em; }
    .modalContent {
      padding: 1rem;
      gap: 10px;
      box-shadow: 6px 6px 0 var(--ink);
    }
    .modalContent h2 { font-size: 1.5rem; }
    .modalActions button {
      flex: 1 1 100%;
      padding: 0.7rem;
      font-size: 0.7rem;
    }
  }

  @media (max-width: 380px) {
    .calendarHeader h2 { font-size: 1.05rem; }
    .viewBtn { padding: 0.35rem 0.5rem; font-size: 0.58rem; }
    .dayNumber { font-size: 0.85rem; }
    .eventChip { font-size: 0.5rem; }
  }
</style>
</head>
<body>

<button id="menuToggle" aria-label="Toggle menu">☰</button>
<div id="sideBackdrop"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <h1>Horolix</h1>
    <button id="newEventBtn">+ New Event</button>

    <div class="dateBox">
      <div id="todayDateBig">---</div>
      <div id="todayDateSub">---</div>
    </div>

    <input type="text" id="searchInput" placeholder="SEARCH EVENTS">

    <div class="year-row">
      <button id="yearMinusBtn" title="-100 years">–100</button>
      <select id="yearSelector" aria-label="Year"></select>
      <button id="yearPlusBtn" title="+100 years">+100</button>
    </div>

    <div class="decade-row">
      <button id="decadeMinusBtn">–10 YRS</button>
      <button id="decadePlusBtn">+10 YRS</button>
    </div>

    <button id="themeBtn">◐ DARK MODE</button>

    <div class="importExport">
      <button id="exportBtn">▲ EXPORT</button>
      <input type="file" id="importFile" hidden accept=".json,application/json">
      <button id="importBtn">▼ IMPORT</button>
    </div>

    <div class="sidebar-foot">BCE <span>•</span> CE <span>•</span> ∞</div>
  </aside>

  <main class="calendarContainer">
    <header class="calendarHeader">
      <div class="leftHeader">
        <button id="prevBtn" aria-label="Previous">◀</button>
        <button id="todayBtn">TODAY</button>
        <button id="nextBtn" aria-label="Next">▶</button>
      </div>
      <h2 id="monthYear">---</h2>
      <div class="rightHeader">
        <button class="viewBtn active" data-view="month">MONTH</button>
        <button class="viewBtn" data-view="week">WEEK</button>
        <button class="viewBtn" data-view="day">DAY</button>
        <button class="viewBtn" data-view="agenda">AGENDA</button>
      </div>
    </header>

    <div class="weekDays">
      <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
    </div>

    <div id="calendarGrid"></div>
  </main>
</div>

<div class="modal hidden" id="eventModal">
  <div class="modalContent">
    <h2 id="modalTitle">EVENT</h2>
    <input type="text" id="eventTitle" placeholder="TITLE *" autocomplete="off">
    <textarea id="eventDescription" placeholder="DESCRIPTION" rows="3"></textarea>
    <input type="date" id="eventDate">
    <select id="recurringSelect">
      <option value="none">NO REPEAT</option>
      <option value="daily">DAILY</option>
      <option value="weekly">WEEKLY</option>
      <option value="monthly">MONTHLY</option>
    </select>
    <input type="color" id="eventColor" value="#ff4d00">
    <div class="modalActions">
      <button id="saveEventBtn">SAVE</button>
      <button id="cancelBtn">CANCEL</button>
      <button id="deleteEventBtn">DELETE</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   HOROLIX — main
   ============================================================ */
(function () {
  "use strict";

  const calendarGrid = document.getElementById("calendarGrid");
  const monthYear    = document.getElementById("monthYear");
  const modal        = document.getElementById("eventModal");
  const searchInput  = document.getElementById("searchInput");
  const yearSelector = document.getElementById("yearSelector");
  const htmlEl       = document.documentElement;
  const sidebar      = document.getElementById("sidebar");
  const menuToggle   = document.getElementById("menuToggle");
  const sideBackdrop = document.getElementById("sideBackdrop");

  let currentDate = new Date();
  let currentView = "month";
  let events      = [];
  let editingId   = null;

  /* ---------- STORAGE ---------- */
  function loadEvents() {
    try { events = JSON.parse(localStorage.getItem("horolix_events")) || []; }
    catch { events = []; }
    if (!Array.isArray(events)) events = [];
  }
  function persistEvents() {
    try { localStorage.setItem("horolix_events", JSON.stringify(events)); } catch (_) {}
  }
  function saveEvents() {
    persistEvents();
    renderCurrentView();
  }

  /* ---------- DATE HELPERS ---------- */
  const pad = n => String(n).padStart(2, "0");
  const dateKeyFromParts = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const dateKeyFromDate  = dt => dateKeyFromParts(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());

  function todayIST() {
    return new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" });
  }
  const todayKey = todayIST;

  function formatYearWithEra(year) {
    if (year < 0)  return `${Math.abs(year)} BCE`;
    if (year === 0) return `1 BCE`;
    return `${year} CE`;
  }
  function parseDateKey(key) {
    const [y, m, d] = key.split("-").map(Number);
    return { y, m, d };
  }

  /* ---------- YEAR SELECTOR ---------- */
  function populateYearSelector(centerYear) {
    const RANGE = 250;
    const frag = document.createDocumentFragment();
    yearSelector.innerHTML = "";
    for (let y = centerYear - RANGE; y <= centerYear + RANGE; y++) {
      const opt = document.createElement("option");
      opt.value = y;
      opt.textContent = y < 0 ? `${Math.abs(y)} BCE` : (y === 0 ? "1 BCE" : `${y} CE`);
      if (y === centerYear) opt.selected = true;
      frag.appendChild(opt);
    }
    yearSelector.appendChild(frag);
  }
  function setCurrentYear(y) {
    const nd = new Date(currentDate);
    nd.setFullYear(y);
    currentDate = nd;
    populateYearSelector(y);
    renderCurrentView();
  }

  /* ---------- RECURRENCE ---------- */
  function expandRecurring(baseEvents) {
    const out = [];
    const horizon = new Date();
    horizon.setFullYear(horizon.getFullYear() + 3);
    baseEvents.forEach(ev => {
      if (!ev || !ev.date) return;
      out.push({ ...ev });
      if (!ev.recurring || ev.recurring === "none") return;
      const { y, m, d } = parseDateKey(ev.date);
      let cur = new Date(y, m - 1, d);
      if (isNaN(cur.getTime())) return;
      const step = dt => {
        if (ev.recurring === "daily")   dt.setDate(dt.getDate() + 1);
        if (ev.recurring === "weekly")  dt.setDate(dt.getDate() + 7);
        if (ev.recurring === "monthly") dt.setMonth(dt.getMonth() + 1);
      };
      step(cur);
      let safety = 0;
      while (cur <= horizon && safety++ < 2000) {
        out.push({
          ...ev,
          id: ev.id + "__" + dateKeyFromDate(cur),
          date: dateKeyFromDate(cur),
          recurringParent: ev.id
        });
        step(cur);
      }
    });
    return out;
  }

  function getFilteredEvents() {
    const expanded = expandRecurring(events);
    const q = searchInput.value.trim().toLowerCase();
    if (!q) return expanded;
    return expanded.filter(ev => (ev.title || "").toLowerCase().includes(q));
  }

  /* ---------- UTIL ---------- */
  function pickTextColor(hex) {
    if (!hex || hex[0] !== "#" || hex.length < 7) return "#fff";
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? "#111" : "#fff";
  }
  const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);

  /* ---------- ROUTER ---------- */
  function renderCurrentView() {
    if (currentView === "month")  return renderMonthView();
    if (currentView === "week")   return renderWeekView();
    if (currentView === "day")    return renderDayView();
    if (currentView === "agenda") return renderAgendaView();
  }

  /* ---------- MONTH ---------- */
  function renderMonthView() {
    const y = currentDate.getFullYear();
    const m = currentDate.getMonth();
    const firstDow = new Date(y, m, 1).getDay();
    const lastDay  = new Date(y, m + 1, 0).getDate();

    monthYear.textContent =
      `${currentDate.toLocaleString("default", { month: "long" }).toUpperCase()} ${formatYearWithEra(y).toUpperCase()}`;

    calendarGrid.innerHTML = "";
    calendarGrid.style.gridTemplateColumns = "repeat(7, 1fr)";

    for (let i = 0; i < firstDow; i++) {
      const blank = document.createElement("div");
      blank.className = "dayCell";
      blank.style.opacity = "0.25";
      blank.style.cursor = "default";
      calendarGrid.appendChild(blank);
    }

    const filtered = getFilteredEvents();
    const tk = todayKey();

    for (let day = 1; day <= lastDay; day++) {
      const cell = document.createElement("div");
      cell.className = "dayCell";
      const key = dateKeyFromParts(y, m + 1, day);
      cell.dataset.date = key;
      if (key === tk) cell.classList.add("today-highlight");

      const num = document.createElement("div");
      num.className = "dayNumber";
      num.textContent = pad(day);
      if (key === tk) {
        const b = document.createElement("span");
        b.className = "today-icon";
        b.textContent = "TODAY";
        num.appendChild(b);
      }
      cell.appendChild(num);

      filtered.filter(ev => ev.date === key).forEach(ev => {
        const chip = document.createElement("div");
        chip.className = "eventChip";
        chip.style.background = ev.color || "#1a1a1a";
        chip.style.color = pickTextColor(ev.color || "#1a1a1a");
        chip.textContent = ev.title + (ev.recurring && ev.recurring !== "none" ? " ↻" : "");
        chip.draggable = true;
        chip.dataset.eventId = ev.recurringParent || ev.id;
        chip.addEventListener("dragstart", e => {
          e.stopPropagation();
          e.dataTransfer.setData("text/plain", String(ev.recurringParent || ev.id));
        });
        cell.appendChild(chip);
      });

      calendarGrid.appendChild(cell);
    }
  }

  /* ---------- WEEK ---------- */
  function renderWeekView() {
    const start = new Date(currentDate);
    start.setDate(currentDate.getDate() - currentDate.getDay());

    monthYear.textContent =
      `WEEK OF ${start.toDateString().toUpperCase()} · ${formatYearWithEra(currentDate.getFullYear()).toUpperCase()}`;

    calendarGrid.innerHTML = "";
    calendarGrid.style.gridTemplateColumns = "repeat(7, 1fr)";

    const filtered = getFilteredEvents();
    const tk = todayKey();

    for (let i = 0; i < 7; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const key = dateKeyFromDate(d);
      const cell = document.createElement("div");
      cell.className = "dayCell";
      cell.dataset.date = key;
      if (key === tk) cell.classList.add("today-highlight");

      const head = document.createElement("div");
      head.className = "dayNumber";
      head.textContent = d.toLocaleDateString("en-US", {
        weekday: "short", month: "numeric", day: "numeric"
      }).toUpperCase();
      if (key === tk) {
        const b = document.createElement("span");
        b.className = "today-icon"; b.textContent = "TODAY";
        head.appendChild(b);
      }
      cell.appendChild(head);

      filtered.filter(ev => ev.date === key).forEach(ev => {
        const chip = document.createElement("div");
        chip.className = "eventChip";
        chip.style.background = ev.color || "#1a1a1a";
        chip.style.color = pickTextColor(ev.color || "#1a1a1a");
        chip.textContent = ev.title;
        cell.appendChild(chip);
      });

      calendarGrid.appendChild(cell);
    }
  }

  /* ---------- DAY ---------- */
  function renderDayView() {
    const key = dateKeyFromDate(currentDate);
    monthYear.textContent =
      `${currentDate.toDateString().toUpperCase()} · ${formatYearWithEra(currentDate.getFullYear()).toUpperCase()}`;

    calendarGrid.innerHTML = "";
    calendarGrid.style.gridTemplateColumns = "1fr";

    const cell = document.createElement("div");
    cell.className = "dayCell";
    cell.style.minHeight = "500px";
    cell.style.cursor = "default";
    if (key === todayKey()) cell.classList.add("today-highlight");

    const h = document.createElement("h3");
    h.style.cssText = "font-family:'VT323',monospace;font-size:2rem;font-weight:400;text-transform:uppercase;margin-bottom:16px;border-bottom:2px dashed var(--mute);padding-bottom:8px;";
    h.textContent = `▸ ${currentDate.toDateString()}`;
    if (key === todayKey()) {
      const b = document.createElement("span");
      b.className = "today-icon"; b.textContent = " TODAY";
      h.appendChild(b);
    }
    cell.appendChild(h);

    getFilteredEvents().filter(ev => ev.date === key).forEach(ev => {
      const chip = document.createElement("div");
      chip.className = "eventChip";
      chip.style.cssText = `background:${ev.color || "#1a1a1a"};color:${pickTextColor(ev.color || "#1a1a1a")};padding:14px;font-size:0.85rem;margin-bottom:8px;`;
      chip.textContent = ev.title;
      if (ev.description) {
        const desc = document.createElement("div");
        desc.style.cssText = "margin-top:6px;font-weight:500;font-size:0.7rem;opacity:0.9;text-transform:none;letter-spacing:0;";
        desc.textContent = ev.description;
        chip.appendChild(desc);
      }
      cell.appendChild(chip);
    });

    calendarGrid.appendChild(cell);
  }

  /* ---------- AGENDA ---------- */
  function renderAgendaView() {
    const sorted = [...getFilteredEvents()].sort((a, b) => {
      const A = a.date.split("-").map(Number);
      const B = b.date.split("-").map(Number);
      if (A[0] !== B[0]) return A[0] - B[0];
      if (A[1] !== B[1]) return A[1] - B[1];
      return A[2] - B[2];
    });

    monthYear.textContent = "INFINITE AGENDA · BCE → ∞";
    calendarGrid.innerHTML = "";
    calendarGrid.style.gridTemplateColumns = "1fr";

    const wrap = document.createElement("div");
    wrap.style.padding = "1.25rem";
    if (!sorted.length) {
      wrap.innerHTML = "<p style='text-transform:uppercase;font-weight:700;padding:1rem;border:2px dashed var(--mute);'>// NO EVENTS ACROSS TIMELINE.</p>";
    }

    const tk = todayKey();
    sorted.forEach((ev, i) => {
      const card = document.createElement("div");
      card.style.cssText = "background:var(--paper);border:2px solid var(--ink);margin:10px 0;padding:14px 16px;display:flex;gap:14px;align-items:flex-start;box-shadow:4px 4px 0 var(--ink);";

      const y = parseInt(ev.date.split("-")[0], 10);
      const era = y < 0 ? `${Math.abs(y)} BCE` : (y === 0 ? "1 BCE" : `${y} CE`);
      const isToday = ev.date === tk;

      card.innerHTML = `
        <div style="font-family:'VT323',monospace;font-size:1.6rem;line-height:1;color:var(--accent);min-width:44px;text-align:right;">
          ${pad(i + 1)}
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:800;font-size:0.95rem;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink);word-break:break-word;">
            ${escapeHtml(ev.title)}${isToday ? ' <span class="today-icon" style="font-size:9px;padding:1px 5px;">TODAY</span>' : ''}
          </div>
          <div style="margin-top:6px;font-size:0.72rem;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--mute);word-break:break-word;">
            📅 ${ev.date} · ${era}${ev.recurring && ev.recurring !== "none" ? " · ↻ " + ev.recurring.toUpperCase() : ""}
          </div>
        </div>
        <div style="width:8px;min-height:44px;background:${ev.color};border:1px solid var(--ink);flex-shrink:0;"></div>
      `;
      wrap.appendChild(card);
    });

    calendarGrid.appendChild(wrap);
  }

  /* ---------- MODAL ---------- */
  function openModal(editEv = null, prefDate = null) {
    const titleEl = document.getElementById("modalTitle");
    const titleInput = document.getElementById("eventTitle");
    const descInput = document.getElementById("eventDescription");
    const dateInput = document.getElementById("eventDate");
    const recSel = document.getElementById("recurringSelect");
    const colorInput = document.getElementById("eventColor");

    if (editEv) {
      editingId = editEv.id;
      titleEl.textContent = "EDIT EVENT";
      titleInput.value = editEv.title || "";
      descInput.value = editEv.description || "";
      dateInput.value = editEv.date || "";
      recSel.value = editEv.recurring || "none";
      colorInput.value = editEv.color || "#ff4d00";
    } else {
      editingId = null;
      titleEl.textContent = "NEW EVENT";
      titleInput.value = "";
      descInput.value = "";
      dateInput.value = prefDate || dateKeyFromDate(currentDate);
      recSel.value = "none";
      colorInput.value = "#ff4d00";
    }
    modal.classList.remove("hidden");
    setTimeout(() => titleInput.focus(), 40);
  }

  function saveFromModal() {
    const title = document.getElementById("eventTitle").value.trim();
    if (!title) { alert("TITLE REQUIRED"); return; }
    const dateVal = document.getElementById("eventDate").value;
    if (!dateVal) { alert("DATE REQUIRED"); return; }

    const payload = {
      title,
      description: document.getElementById("eventDescription").value,
      date: dateVal,
      recurring: document.getElementById("recurringSelect").value,
      color: document.getElementById("eventColor").value
    };

    if (editingId) {
      const idx = events.findIndex(e => e.id === editingId);
      if (idx >= 0) events[idx] = { ...events[idx], ...payload };
    } else {
      events.push({
        id: "ev_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
        ...payload
      });
    }
    saveEvents();
    modal.classList.add("hidden");
  }

  function deleteFromModal() {
    if (!editingId) return;
    if (!confirm("DELETE THIS EVENT?")) return;
    events = events.filter(e => e.id !== editingId);
    saveEvents();
    modal.classList.add("hidden");
  }

  /* ---------- WIRING ---------- */
  document.getElementById("newEventBtn").onclick = () => openModal(null, dateKeyFromDate(currentDate));
  document.getElementById("saveEventBtn").onclick = saveFromModal;
  document.getElementById("cancelBtn").onclick = () => modal.classList.add("hidden");
  document.getElementById("deleteEventBtn").onclick = deleteFromModal;

  document.getElementById("prevBtn").onclick = () => {
    if (currentView === "month")     currentDate.setMonth(currentDate.getMonth() - 1);
    else if (currentView === "week") currentDate.setDate(currentDate.getDate() - 7);
    else                             currentDate.setDate(currentDate.getDate() - 1);
    populateYearSelector(currentDate.getFullYear());
    renderCurrentView();
  };
  document.getElementById("nextBtn").onclick = () => {
    if (currentView === "month")     currentDate.setMonth(currentDate.getMonth() + 1);
    else if (currentView === "week") currentDate.setDate(currentDate.getDate() + 7);
    else                             currentDate.setDate(currentDate.getDate() + 1);
    populateYearSelector(currentDate.getFullYear());
    renderCurrentView();
  };
  document.getElementById("todayBtn").onclick = () => {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Kolkata",
      year: "numeric", month: "2-digit", day: "2-digit"
    }).format(new Date()).split("-").map(Number);
    currentDate = new Date(parts[0], parts[1] - 1, parts[2]);
    populateYearSelector(currentDate.getFullYear());
    renderCurrentView();
  };

  document.getElementById("yearMinusBtn").onclick = () => setCurrentYear(currentDate.getFullYear() - 100);
  document.getElementById("yearPlusBtn").onclick  = () => setCurrentYear(currentDate.getFullYear() + 100);
  document.getElementById("decadeMinusBtn").onclick = () => setCurrentYear(currentDate.getFullYear() - 10);
  document.getElementById("decadePlusBtn").onclick  = () => setCurrentYear(currentDate.getFullYear() + 10);

  yearSelector.onchange = () => setCurrentYear(parseInt(yearSelector.value, 10));

  document.querySelectorAll(".viewBtn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".viewBtn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentView = btn.dataset.view;
      renderCurrentView();
    });
  });

  calendarGrid.addEventListener("click", e => {
    const chip = e.target.closest(".eventChip");
    if (chip) {
      const id = chip.dataset.eventId;
      const ev = events.find(x => x.id === id);
      if (ev) openModal(ev);
      return;
    }
    const cell = e.target.closest(".dayCell");
    if (cell && cell.dataset.date) openModal(null, cell.dataset.date);
  });

  calendarGrid.addEventListener("dragover", e => {
    if (e.target.closest(".dayCell")) e.preventDefault();
  });
  calendarGrid.addEventListener("drop", e => {
    const cell = e.target.closest(".dayCell");
    if (!cell || !cell.dataset.date) return;
    e.preventDefault();
    const id = e.dataTransfer.getData("text/plain");
    if (!id) return;
    const ev = events.find(x => x.id === id);
    if (ev) { ev.date = cell.dataset.date; saveEvents(); }
  });

  searchInput.oninput = () => renderCurrentView();

  /* ---------- THEME ---------- */
  const themeBtn = document.getElementById("themeBtn");
  function applyTheme(theme) {
    htmlEl.setAttribute("data-theme", theme);
    themeBtn.textContent = theme === "dark" ? "◑ LIGHT MODE" : "◐ DARK MODE";
  }
  themeBtn.addEventListener("click", () => {
    const cur = htmlEl.getAttribute("data-theme") === "dark" ? "dark" : "light";
    const next = cur === "dark" ? "light" : "dark";
    try { localStorage.setItem("horolix_theme", next); } catch (_) {}
    applyTheme(next);
  });

  /* ---------- EXPORT ---------- */
  function exportEvents() {
    const json = JSON.stringify(events, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "horolix_backup_" + todayIST() + ".json";
    a.rel = "noopener";
    a.style.display = "none";

    document.body.appendChild(a);
    a.click();

    setTimeout(() => {
      try { document.body.removeChild(a); } catch (_) {}
      URL.revokeObjectURL(url);
    }, 250);
  }

  /* ---------- IMPORT ---------- */
  function importEvents(file) {
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data)) { alert("INVALID FILE · EXPECTED ARRAY"); return; }
        const cleaned = data
          .filter(x => x && typeof x === "object" && typeof x.date === "string" && typeof x.title === "string")
          .map(x => ({
            id: x.id || ("ev_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7)),
            title: x.title,
            description: x.description || "",
            date: x.date,
            recurring: x.recurring || "none",
            color: x.color || "#ff4d00"
          }));
        events = cleaned;
        saveEvents();
        alert("IMPORTED " + cleaned.length + " EVENTS");
      } catch (err) {
        alert("INVALID FILE · " + (err.message || "PARSE ERROR"));
      }
    };
    reader.onerror = () => alert("COULD NOT READ FILE");
    reader.readAsText(file);
  }

  document.getElementById("exportBtn").onclick = exportEvents;
  document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
  document.getElementById("importFile").onchange = e => {
    const file = e.target.files && e.target.files[0];
    if (file) importEvents(file);
    e.target.value = "";
  };

  modal.addEventListener("click", e => { if (e.target === modal) modal.classList.add("hidden"); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") modal.classList.add("hidden");
  });

  /* ---------- TODAY DATE READOUT (IST) ---------- */
  const dateBigEl = document.getElementById("todayDateBig");
  const dateSubEl = document.getElementById("todayDateSub");

  function renderTodayReadout() {
    const now = new Date();
    const dayStr = now.toLocaleDateString("en-GB", {
      timeZone: "Asia/Kolkata",
      day: "2-digit"
    });
    const monthStr = now.toLocaleDateString("en-GB", {
      timeZone: "Asia/Kolkata",
      month: "short"
    }).toUpperCase();
    const yearStr = now.toLocaleDateString("en-GB", {
      timeZone: "Asia/Kolkata",
      year: "numeric"
    });
    const weekday = now.toLocaleDateString("en-GB", {
      timeZone: "Asia/Kolkata",
      weekday: "long"
    }).toUpperCase();

    dateBigEl.textContent = `${dayStr} ${monthStr}`;
    dateSubEl.textContent = `${weekday} · ${yearStr}`;
  }

  /* ---------- MOBILE DRAWER ---------- */
  function openSidebar() {
    sidebar.classList.add("open");
    sideBackdrop.classList.add("show");
  }
  function closeSidebar() {
    sidebar.classList.remove("open");
    sideBackdrop.classList.remove("show");
  }
  menuToggle.addEventListener("click", () => {
    sidebar.classList.contains("open") ? closeSidebar() : openSidebar();
  });
  sideBackdrop.addEventListener("click", closeSidebar);
  sidebar.addEventListener("click", e => {
    if (window.innerWidth <= 820 && e.target.closest("button")) {
      setTimeout(closeSidebar, 120);
    }
  });
  window.addEventListener("resize", () => {
    if (window.innerWidth > 820) closeSidebar();
  });

  /* ---------- BOOT ---------- */
  loadEvents();

  let savedTheme = "light";
  try { savedTheme = localStorage.getItem("horolix_theme") || "light"; } catch (_) {}
  applyTheme(savedTheme);

  populateYearSelector(currentDate.getFullYear());

  requestAnimationFrame(() => {
    renderCurrentView();
    window.addEventListener("resize", () => renderCurrentView());
  });

  renderTodayReadout();
  setInterval(renderTodayReadout, 60 * 60 * 1000);

})();
</script>
</body>
</html>
